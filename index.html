<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIVEL VPN Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: Arial, sans-serif; background: #111318; color: #fff; padding: 24px; }
.card { max-width: 420px; margin: 0 auto; background: #1c2029; padding: 20px; border-radius: 14px; }
button { width: 100%; padding: 12px; margin-top: 14px; border: 0; border-radius: 10px; background: #2ea6ff; color: #fff; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
<h2>AIVEL VPN</h2>
<p>Мини-приложение подключено и работает.</p>
<button onclick="Telegram.WebApp.close()">Закрыть</button>
</div>
<script>
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
}
</script>
</body>
</html>
